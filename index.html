<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Planes y ofertas GHL</title>
<style>
  :root{
    --navy:#023859; --mid:#2A5E95; --blue:#6399BA; --ink:#1a2533;
    --line:#e4e9f0; --bg:#eef2f7; --white:#fff; --muted:#aab4c0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink);
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  header.topbar{
    background:linear-gradient(120deg,var(--navy) 0%,var(--mid) 100%);
    color:#fff; padding:14px 22px 0; flex:0 0 auto;
    box-shadow:0 2px 10px rgba(2,56,89,.18);
  }
  .brand{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding-bottom:12px;
  }
  .brand h1{
    font-size:19px; font-weight:700; margin:0; letter-spacing:.2px;
  }
  .brand .badge{
    background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.28);
    color:#fff; font-size:12.5px; font-weight:600; padding:4px 11px;
    border-radius:999px; white-space:nowrap;
  }
  .brand .spacer{flex:1}
  .brand .sub{font-size:12px; color:#cfe0ec; font-weight:500}
  nav.tabs{display:flex; gap:4px}
  nav.tabs button{
    appearance:none; border:0; cursor:pointer; font:inherit;
    background:rgba(255,255,255,.10); color:#dce8f1;
    font-size:14px; font-weight:600; letter-spacing:.3px;
    padding:11px 26px; border-radius:9px 9px 0 0; transition:.15s;
  }
  nav.tabs button:hover{background:rgba(255,255,255,.20); color:#fff}
  nav.tabs button.active{background:var(--bg); color:var(--navy)}
  main{flex:1 1 auto; position:relative; background:var(--bg)}
  main iframe{
    position:absolute; inset:0; width:100%; height:100%; border:0;
    background:var(--bg);
  }
  main iframe[hidden]{display:none}
  .loader{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--mid); font-size:14px; font-weight:600; gap:10px;
  }
  .loader .dot{
    width:10px;height:10px;border-radius:50%;background:var(--blue);
    animation:pulse 1s infinite ease-in-out;
  }
  @keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Dashboard Planes y ofertas</h1>
      <span class="badge">50 propiedades</span>
      <span class="spacer"></span>
      <span class="sub">GHL Hoteles</span>
    </div>
    <nav class="tabs" role="tablist">
      <button id="tab-planes"  class="active" role="tab" aria-selected="true"  onclick="showTab('planes')">Planes</button>
      <button id="tab-ofertas"              role="tab" aria-selected="false" onclick="showTab('ofertas')">Ofertas</button>
    </nav>
  </header>

  <main>
    <div class="loader" id="loader"><span class="dot"></span>Cargando dashboard…</div>
    <iframe id="fr-planes"  title="Dashboard de planes"
            data-src="https://santiagocristancho0722.github.io/ghl-planes-individuales/"></iframe>
    <iframe id="fr-ofertas" title="Dashboard de ofertas" hidden
            data-src="https://santiagocristancho0722.github.io/ghl-ofertas-individuales/"></iframe>
  </main>

<script>
  var loaded = {};
  function ensureLoaded(name){
    if (loaded[name]) return;
    var fr = document.getElementById('fr-' + name);
    var loader = document.getElementById('loader');
    if (loader) loader.style.display = 'flex';
    fr.addEventListener('load', function(){ if (loader) loader.style.display = 'none'; }, {once:true});
    fr.src = fr.getAttribute('data-src');
    loaded[name] = true;
  }
  function showTab(name){
    ['planes','ofertas'].forEach(function(n){
      var btn = document.getElementById('tab-' + n);
      var fr  = document.getElementById('fr-' + n);
      var on  = (n === name);
      btn.classList.toggle('active', on);
      btn.setAttribute('aria-selected', on ? 'true' : 'false');
      fr.hidden = !on;
    });
    ensureLoaded(name);
  }
  // Carga la pestaña inicial (Planes)
  ensureLoaded('planes');
</script>
</body>
</html>
